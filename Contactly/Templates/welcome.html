<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
            margin-top: 20px;
        }

        .footer {
            font-size: 12px;
            color: #888;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome, {{name}}!</h2>
        <p>Thanks for registering with <strong>Contactly</strong>. We’re thrilled to have you on board.</p>
        <a href="#" class="btn">Go to Dashboard</a>
        <div class="footer">
            If you didn’t sign up, please ignore this email.
        </div>
    </div>
</body>
</html>
